# This workflow installs dependencies and runs the heal test suite.
# PR CI runs only what is deterministic without an LLM or external sites:
# unit tests (no LLM, no browser) and the timing acceptance test (no LLM).
# Live-LLM acceptance suites (tagged live-llm) need HEAL_* secrets and are
# not run here; see docs/CONTRIBUTING for running them locally.

name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
    - name: Install dependencies
      run: |
        uv sync --all-extras
        uv run rfbrowser init
        npx playwright install-deps
    - name: Run heal unit tests
      run: |
        uv run invoke heal-utests
    - name: Run heal acceptance tests (deterministic, no LLM)
      run: |
        uv run invoke heal-atests
    - name: Store Artifact
      uses: actions/upload-artifact@v4
      if: success() || failure()
      with:
        name: test-results ${{ matrix.python-version }}
        path: |
          results/**/*.html
          results/**/*.xml
    - name: Test Report
      uses: dorny/test-reporter@main
      if: success() || failure()
      with:
        name: unit tests ${{ matrix.python-version }}
        path: results/pytest.xml
        reporter: java-junit
