# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
      LLM_TEXT_MODEL: ${{ vars.LLM_TEXT_MODEL }}
      LLM_LOCATOR_MODEL: ${{ vars.LLM_LOCATOR_MODEL }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
    - name: Install dependencies
      run: |
        uv sync
        uv run rfbrowser init
        npx playwright install-deps
    - name: Run heal unit tests
      run: |
        uv run invoke heal-utests
    - name: Run heal acceptance tests (deterministic)
      run: |
        uv run invoke heal-atests
    - name: Run tests
      run: |
        uv run invoke tests
    - name: Store Artifact
      uses: actions/upload-artifact@v4
      if: success() || failure()
      with:
        name: test-results ${{ matrix.python-version }} # Choose a descriptive name for your artifact
        path: |
          results/*.html
          results/*.xml
          results/*.prof
          results/*.txt
    - name: Test Report
      uses: dorny/test-reporter@main
      if: success() || failure()    # run this step even if previous step failed
      with:
        name: xUnit Tests ${{ matrix.python-version }}            # Name of the check run which will be created
        path: results/pytest.xml,results/xunit.xml    # Path to test results
        reporter: java-junit        # Format of test results
