site_name: Robot Framework Heal
site_description: Failure triage, self-healing and root-cause analysis for Robot Framework UI tests.
site_url: https://manykarim.github.io/robotframework-heal/
repo_url: https://github.com/manykarim/robotframework-heal
repo_name: manykarim/robotframework-heal
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

exclude_docs: |
  images/README.md

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_reference.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  version:
    provider: mike
    default: latest

nav:
  - Home: index.md
  - What you get: what-you-get.md
  - Tutorials:
      - tutorials/getting-started.md
  - How-to guides:
      - Configure a model provider: how-to/model-providers.md
      - Use SeleniumLibrary: how-to/selenium.md
      - Use AppiumLibrary: how-to/appium.md
      - Gate CI on results: how-to/ci-gating.md
      - Fix test files: how-to/fixing-files.md
      - Reuse fixes across runs: how-to/warm-start.md
      - Drive from a coding agent: how-to/mcp-coding-agents.md
  - Reference:
      - Configuration: reference/configuration.md
      - CLI: reference/cli.md
      - Failure classes: reference/failure-classes.md
      - Drivers: reference/drivers.md
      - Report artifacts: reference/reports.md
      - Migrating from 0.3: reference/migration.md
  - Explanation:
      - Failure taxonomy and triage: explanation/failure-taxonomy.md
      - Tiered locator healing: explanation/tiered-locators.md
      - Capability-tiered models: explanation/model-tiers.md
      - Threading and execution: explanation/threading.md
      - Root-cause analysis and fixes: explanation/rca-and-fixes.md
