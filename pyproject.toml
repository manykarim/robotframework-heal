[project]
name = "robotframework-heal"
version = "0.4.0.dev1"
description = "A Robot Framework Listener for library agnostic self-healing, failure triage and root cause analysis of tests"
authors = [
    { name = "Many Kasiriha", email = "many.kasiriha@dbschenker.com" },
]
maintainers = [
    { name = "Many Kasiriha", email = "many.kasiriha@dbschenker.com" },
]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "robotframework",
    "robotframework-browser",
    "robotframework-appiumlibrary",
    "beautifulsoup4",
    "opencv-python-headless",
    "python-dotenv",
    "pyautogui",
    "tinydb",
    "cssify",
    "parsimonious",
    "lxml",
    "thefuzz",
    "jinja2",
    "litellm",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pydantic-ai-slim[openai]>=1.107.0",
    "typer>=0.25.1",
    "mcp>=1.27.2",
]

[project.urls]
Homepage = "https://github.com/manykarim/robotframework-heal"

[project.scripts]
heal = "heal.cli.main:app"

[dependency-groups]
dev = [
    "pytest",
    "invoke",
    "coverage",
    "robotframework-stacktrace",
    "mkdocs-material",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/SelfHealing", "src/heal"]

[tool.hatch.build.targets.sdist]
exclude = [
    "src/SelfHealing/.env",
]

[tool.uv]
package = true
